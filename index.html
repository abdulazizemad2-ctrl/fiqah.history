<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بنك أسئلة تاريخ الفقه</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: grey Canva-style frame, white rounded "page" holding filters on top and a single column of question cards */
:root{
  --frame:#6b7380; --page:#ffffff; --ink:#151515; --muted:#5b616b; --line:#d9dce1;
  --bar:#3d3d3d; --bar-ink:#ffffff; --teal:#8ec5cc; --teal-soft:#eaf5f6; --navy:#15004f;
  --red:#e3173e; --red-soft:#fdecef; --green:#12a150; --green-soft:#e8f6ee; --blue:#2a3bb7; --chip:#f1f2f4;
  --font:'Tajawal','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --frame:#2b2f36; --page:#17191d; --ink:#eceef1; --muted:#a3a9b3; --line:#343841;
  --bar:#0d0e10; --bar-ink:#f2f3f5; --teal:#5fa8b1; --teal-soft:#1b2b2e; --navy:#8f84ff;
  --red:#ff5c79; --red-soft:#3a1820; --green:#3ccf7a; --green-soft:#15291e; --blue:#8c9bff; --chip:#22252b; color-scheme:dark}}
:root[data-theme="dark"]{
  --frame:#2b2f36; --page:#17191d; --ink:#eceef1; --muted:#a3a9b3; --line:#343841;
  --bar:#0d0e10; --bar-ink:#f2f3f5; --teal:#5fa8b1; --teal-soft:#1b2b2e; --navy:#8f84ff;
  --red:#ff5c79; --red-soft:#3a1820; --green:#3ccf7a; --green-soft:#15291e; --blue:#8c9bff; --chip:#22252b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--frame);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.75;direction:rtl;
  padding-block:20px 40px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.page{max-width:860px;margin:0 auto;background:var(--page);border-radius:28px;padding:28px clamp(16px,4vw,40px) 36px}
header{text-align:center;display:grid;gap:6px;justify-items:center;margin-bottom:18px}
header img{width:min(240px,60%);height:auto}
:root[data-theme="dark"] header img{filter:invert(1) hue-rotate(180deg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header img{filter:invert(1) hue-rotate(180deg)}}
h1{font-size:clamp(24px,5vw,32px);font-weight:800;margin:6px 0 0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0}
.bar{background:var(--bar);color:var(--bar-ink);border-radius:14px;padding:9px 16px;text-align:center;font-weight:700;font-size:16px;margin:22px 0 12px}
.ctl{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .lbl{font-weight:700;min-width:64px;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--bar);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button,.chips button{font:inherit;cursor:pointer;border:0;background:transparent;color:var(--ink)}
.seg button{padding:7px 16px;font-weight:700;font-size:15px}
.seg button+button{border-inline-start:1.5px solid var(--bar)}
.seg button[aria-pressed="true"]{background:var(--bar);color:var(--bar-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--chip);border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:500}
.chips button[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);font-weight:700}
.chips .n{display:inline-block;min-width:22px;margin-inline-start:6px;background:var(--navy);color:#fff;border-radius:999px;font-size:12px;padding:0 6px;text-align:center}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;padding:10px 14px;border:1.5px dashed var(--line);border-radius:14px;font-size:14px}
.stats b{font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:6px 14px;border:1.5px solid var(--bar);background:var(--page);color:var(--ink)}
.btn.dark{background:var(--bar);color:var(--bar-ink)}
.list{display:grid;gap:14px;margin-top:16px}
.q{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px 12px;min-width:0}
.qhead{display:flex;gap:8px;align-items:flex-start}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:2px;font-variant-numeric:tabular-nums}
.qt{font-weight:700;font-size:16.5px;min-width:0}
.tags{display:flex;gap:6px;margin:6px 36px 0 0;flex-wrap:wrap}
.tag{font-size:12px;border-radius:6px;padding:0 8px;background:var(--chip);color:var(--muted)}
.tag.old{background:var(--red);color:#fff}
.opts{display:grid;gap:8px;margin:12px 36px 4px 0}
.opt{font:inherit;text-align:start;cursor:pointer;display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--page);color:var(--ink);border-radius:12px;padding:8px 12px}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--bar);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--teal);background:var(--teal-soft)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .k{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.opt.pick{border-color:var(--navy);background:var(--teal-soft)}
.exp{margin:8px 36px 0 0;font-size:14.5px;border-inline-start:4px solid var(--teal);padding:4px 12px;background:var(--teal-soft);border-radius:8px}
.exp .v{font-weight:800}
.exp .v.ok{color:var(--green)} .exp .v.no{color:var(--red)}
.ans{margin:10px 36px 0 0;border-inline-start:4px solid var(--green);background:var(--green-soft);border-radius:8px;padding:6px 14px;font-size:15px}
.ans p{margin:4px 0} .ans ol{margin:4px 0;padding-inline-start:22px} .ans b{color:var(--blue)}
.ans .note{color:var(--muted);font-size:13.5px}
.essay-tools{margin:10px 36px 0 0;display:flex;gap:8px;flex-wrap:wrap}
textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--page);color:var(--ink);min-height:70px;resize:vertical}
.wrap-ta{margin:10px 36px 0 0}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:1.5px dashed var(--line);border-radius:16px}
.result{border:2px solid var(--navy);border-radius:16px;padding:14px;text-align:center;font-size:18px;font-weight:700;margin-top:14px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:26px}
footer a{color:var(--muted)}
@media (max-width:520px){.opts,.exp,.ans,.tags,.essay-tools,.wrap-ta{margin-right:0}}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .15s,border-color .15s}}
</style>
</head>

{c:3,s:'old',t:'mcq',q:'ذهبوا إلى القول بأن الشريعة الإسلامية تأثرت بالقانون الروماني:',o:['الرومان','المستشرقون','اليهود','الفرس'],a:1,e:'ادّعى بعض المستشرقين تأثر الفقه بالنظم السابقة، ومنهم جولد تسيهر وشاخت.'},
{c:3,s:'old',t:'essay',q:'هناك ادعاءات تزعم أن الفقه الإسلامي تأثر بالنظم السابقة، اذكر ادعاءين، ثم رد عليهما بإيجاز.',ans:`<p><b>الادعاء الأول:</b> أن النبي صلى الله عليه وسلم أخذ التشريعات من القانون الروماني البيزنطي في رحلتيه إلى الشام.</p><p><b>الرد:</b> كان في الأولى صغيراً مع عمه أبي طالب، وفي الثانية يتّجر في مال خديجة مع رفقة من العرب الخُلَّص، ولم يثبت لقاؤه بعلماء القانون، وبحيرى راهب لا رجل قانون، وكان صلى الله عليه وسلم أمياً: ﴿وَمَا كُنتَ تَتْلُو مِن قَبْلِهِ مِن كِتَابٍ وَلَا تَخُطُّهُ بِيَمِينِكَ﴾.</p><p><b>الادعاء الثاني:</b> أن الفقهاء تأثروا بالقانون الروماني (جولد تسيهر وشاخت).</p><p><b>الرد:</b> الفقهاء يستمدون علمهم من الشريعة، والمدارس القانونية لا يصح التأثر بها (بيروت دُمّرت والإسكندرية أُغلقت قبل عام الفيل، وروما لم تُفتح، والقسطنطينية فُتحت بعد استقرار الفقه)، ولا توجد ترجمات لكتب القانون الروماني، والوحي انقطع قبل خروج المسلمين من الجزيرة.</p><p class="note">ويصح ذكر الادعاء الثالث (التأثر غير المباشر) بدل أحدهما، والرد: أن طبيعة الجزيرة القاحلة لم تُغرِ الفرس ولا الروم بالاحتكاك بها.</p>`},

{c:7,s:'old',t:'essay',q:'اتخذ العلماء مناهج عدة عند تدوين علم الفقه، اذكر ثلاثة مناهج مع التمثيل لكل منهج باسم الكتاب والمؤلف.',ans:`<ol><li><b>تدوين الفقه مختلطاً بالحديث والأثر:</b> مثل «الموطأ» للإمام مالك، و«الأم» للإمام الشافعي.</li><li><b>تدوين الفقه مجرداً من الحديث والأثر:</b> مثل بعض كتب ظاهر الرواية لمحمد بن الحسن الشيباني.</li><li><b>تدوين الفقه بالأدلة مقارناً بأقوال الفقهاء.</b></li></ol><p class="note">لم يذكر الملخص مثالاً للمنهج الثالث، فراجع فيه شرح الدكتور.</p>`},

{c:8,s:'old',t:'mcq',q:'التزام غير المجتهد مذهب مجتهد معين في الأصول والفروع أو أحدهما هو تعريف:',o:['المذهب الفقهي','التمذهب الفقهي','الفقه الافتراضي','المنهج الفقهي'],a:1,e:'هذا تعريف التمذهب. أما المذهب فهو المنهج الذي سلكه فقيه مجتهد اختص به.'},
{c:8,s:'old',t:'mcq',q:'التعصب لمذهب معين، وتقديمه على غيره بدون دليل:',o:['مذموم','مباح','جائز','ممدوح'],a:0,e:'التعصب المذهبي مذموم شرعاً وعقلاً، ولا تلازم بين التمذهب والتعصب.'},

{c:8,s:'old',t:'essay',q:'اذكر بإيجاز أربعاً من صور التمذهب، مع بيان حكم كل صورة.',ans:`<ol><li><b>أن يلتزم المبتدئ في التفقه أحد المذاهب الأربعة</b> (كالسائد في بلده): <b>جائز</b>، وتركه قد يؤدي إلى التفلت والشذوذ.</li><li><b>أن يتبنى المتقدم في التفقه مذهباً</b> في العلم والعمل والفتوى دون أن يترك الدليل البيّن: <b>جائز ولا ينبغي إنكاره</b>.</li><li><b>التزام التمذهب في القضاء والإفتاء:</b> <b>لا حرج فيه</b>، لعمل المسلمين عبر القرون دون نكير.</li><li><b>التعصب المذهبي</b> (تقديم قول إمام بعينه ديانةً أو ذم المذاهب الأخرى): <b>مذموم شرعاً وعقلاً</b>.</li></ol>`},

{c:1,s:'new',t:'mcq',q:'يخرج بقيد (المكتسب من الأدلة) في تعريف الفقه:',o:['الأحكام العقلية','علم المقلد','الأحكام العقدية','العلم الظني'],a:1,e:'المكتسب: ما استفاده الفقيه باجتهاده لا عن تقليد.'},

{c:1,s:'new',t:'mcq',q:'جعل الفقهاء الجنايات آخر أبواب الفقه:',o:['لقلة أهميتها','لقلة وقوعها','لتعلقها بالحاكم','لشدة الحاجة إليها'],a:1,e:'الترتيب: العبادات لشرفها، ثم المعاملات لشدة الحاجة، ثم المناكحات، ثم الجنايات لقلة وقوعها.'},

{c:1,s:'new',t:'mcq',q:'عمل أهل المدينة من الأدلة المختلف فيها، ويحتج به:',o:['الحنفية','الشافعية','الظاهرية','المالكية'],a:3,e:'عمل أهل المدينة عند المالكية، والاستحسان عند الحنفية.'},
{c:1,s:'new',t:'mcq',q:'من قال إن واضع الفقه الأئمة المجتهدون، فباعتبار:',o:['أن القرآن أول مصدر للفقه على الحقيقة','أنهم أول من طبقه انطلاقاً من الوحي','أن بدء التصنيف كان على أيديهم','أنهم أول من فهم النصوص'],a:2,e:'والخلاف في الواضع راجع إلى الاعتبار، وكلها متفقة على أن الفقه مرجعه الوحي.'},
{c:1,s:'new',t:'essay',q:'عرّف الفقه اصطلاحاً، واشرح قيود التعريف الأربعة.',ans:`<p><b>الفقه اصطلاحاً:</b> «العلم بالأحكام الشرعية العملية، المكتسب من أدلتها التفصيلية».</p><ol><li><b>العلم:</b> مطلق الإدراك، فيشمل القطعي والظني.</li><li><b>الأحكام الشرعية:</b> التي تتوقف معرفتها على الشرع، ويخرج بها العقلية واللغوية والحسية.</li><li><b>العملية:</b> المتعلقة بأعمال العباد، احترازاً من العقدية، وهو وصف أغلبي.</li><li><b>المكتسب من الأدلة:</b> ما استفاده الفقيه باجتهاده لا عن تقليد.</li></ol>`},
{c:1,s:'new',t:'essay',q:'اذكر أقسام مسائل الفقه السبعة.',ans:`<ol><li>العبادات</li><li>المعاملات</li><li>الأحوال الشخصية</li><li>السياسة الشرعية</li><li>العقوبات</li><li>السِّيَر (الجهاد)، وحديثاً: العلاقات الدولية</li><li>الآداب</li></ol>`},
{c:1,s:'new',t:'essay',q:'اذكر مرتبتي الأدلة التي يُستمد منها الفقه، مع التمثيل لكل مرتبة.',ans:`<ol><li><b>أدلة متفق عليها:</b> الكتاب، والسنة، والإجماع.</li><li><b>أدلة مختلف فيها:</b> مثل القياس (عند الجمهور خلافاً للظاهرية)، وعمل أهل المدينة (عند المالكية).</li></ol>`},
{c:1,s:'new',t:'essay',q:'بيّن حكم تعلم الفقه، واذكر الدليل على فرض العين.',ans:`<ol><li><b>فرض عين:</b> تعلُّم ضروريات الدين، وما لا تتم العبادات والمعاملات إلا به. ودليله: «طلب العلم فريضة على كل مسلم»، وقاعدة: (ما لا يتم الواجب إلا به فهو واجب).</li><li><b>فرض كفاية:</b> ما زاد عن ذلك، إذا قام به من يكفي سقط عن الباقين.</li></ol>`},
{c:1,s:'new',t:'essay',q:'اذكر دليلاً من القرآن ودليلاً من السنة على فضل الفقه.',ans:`<p><b>من القرآن:</b> ﴿فَلَوْلَا نَفَرَ مِن كُلِّ فِرْقَةٍ مِّنْهُمْ طَائِفَةٌ لِّيَتَفَقَّهُوا فِي الدِّينِ وَلِيُنذِرُوا قَوْمَهُمْ إِذَا رَجَعُوا إِلَيْهِمْ لَعَلَّهُمْ يَحْذَرُونَ﴾ [التوبة: 122].</p><p><b>من السنة:</b> «من يُرِدِ الله به خيراً يُفقِّهه في الدين».</p>`},
{c:1,s:'new',t:'essay',q:'أكمل الفراغ: موضوع علم الفقه: .............، وثمرته: .............',ans:`<p>موضوعه: <b>أفعال المكلفين من حيث حكمها</b>.</p><p>ثمرته: <b>امتثال أوامر الله تعالى، واجتناب نواهيه</b>، وبهذين يحصل خير الدنيا والآخرة.</p>`},

{c:2,s:'new',t:'mcq',q:'(القضاء ملزم، والفتوى غير ملزمة) مثال على:',o:['الفروق الفقهية','الأشباه والنظائر','النوازل الفقهية','تخريج الفروع على الأصول'],a:0,e:'الفروق: مسألتان متشابهتان معنىً وتصوراً، مختلفتان علةً وحكماً.'},
{c:2,s:'new',t:'mcq',q:'الأمور الواقعة بين الناس مما لم يسبق، ويؤثر فيها قول لإمام متبوع، ويحتاج فيها إلى حكم شرعي:',o:['الفتاوى الفقهية','النوازل الفقهية','الضوابط الفقهية','فقه الخلاف'],a:1,e:'أما الفتاوى فهي أجوبة المفتي عما يُسأل عنه من أحكام الشرع.'},
{c:2,s:'new',t:'mcq',q:'من أسماء علم تاريخ الفقه:',o:['أصول الفقه الإسلامي','المدخل لدراسة الفقه الإسلامي','القواعد الفقهية الكلية','فقه الخلاف والموازنة'],a:1,e:'أسماؤه: تاريخ التشريع، وتاريخ الفقه، والمدخل لدراسة الفقه الإسلامي.'},
{c:2,s:'new',t:'mcq',q:'أول من ألقى محاضرات في علم تاريخ الفقه:',o:['محمد الخضري','ابن خلدون','الحجوي الفاسي','ابن القيم'],a:2,e:'ألقاها في نادي المدرسة الثانوية بفاس، ثم جمعها في «الفكر السامي».'},

{c:2,s:'new',t:'mcq',q:'من مصادر استمداد تاريخ الفقه، ويغلب عليها الجدل الفقهي ومحاجّة المخالفين:',o:['كتب التراجم والطبقات','كتب مناقب الأئمة والانتصار لمذاهبهم','كتب الفتاوى والأقضية والنوازل','كتب البرامج والفهارس والأثبات والمشيخات'],a:1,e:'وكتب البرامج والفهارس ترسم خارطة ذهنية للحركة العلمية.'},
{c:2,s:'new',t:'mcq',q:'(إن التاريخ في باطنه نظر وتحقيق، وتعليل الكائنات ومبادئها) قول:',o:['ابن القيم','ابن خلدون','الحجوي','الخضري'],a:1,e:'من أفضل تعريفات التاريخ.'},
{c:2,s:'new',t:'essay',q:'اذكر خمساً من أوجه أهمية علم تاريخ الفقه.',ans:`<ol><li>تعلقه بالفقه، أشرف العلوم وأنفعها.</li><li>ارتباطه بفترة نزول الوحي، أنصع صفحات التاريخ الإسلامي.</li><li>الوقوف على نشأة أسباب الخلاف الفقهي.</li><li>الوقوف على مبادئ ونشأة اصطلاحات أهل العلم.</li><li>الاطلاع على مسالك الأئمة في الاستنباط.</li></ol><p class="note">ومن بقيتها: معرفة طرائق الفقهاء في التعلم والتعليم، ومعرفة هديهم وأقدارهم، والتصدي لعبث المستشرقين، والتعرف على العمق الحضاري للأمة.</p>`},
{c:2,s:'new',t:'essay',q:'اذكر خمسة من مصادر استمداد علم تاريخ الفقه.',ans:`<ol><li>علوم القرآن.</li><li>علوم الحديث.</li><li>السيرة النبوية.</li><li>أصول الفقه.</li><li>الفقه.</li></ol><p class="note">ومن بقيتها: كتب الفتاوى والنوازل، وكتب التاريخ، والتراجم والطبقات، ومناقب الأئمة، والبرامج والفهارس والأثبات والمشيخات.</p>`},
{c:2,s:'new',t:'essay',q:'عرّف كلاً من: القواعد الفقهية، الفروق الفقهية، النوازل الفقهية.',ans:`<p><b>القواعد الفقهية:</b> قضايا كلية فقهية منطبقة على جزئيات عديدة، يُعرف منها أحكام جزئياتها مباشرة.</p><p><b>الفروق الفقهية:</b> علم يبحث في الأمور الفارقة بين مسألتين متشابهتين من حيث المعنى والتصور، مختلفتين من حيث العلة والحكم.</p><p><b>النوازل الفقهية:</b> الأمور الواقعة بين الناس مما لم يسبق، ويؤثر فيها قول لإمام متبوع، ويحتاج فيها إلى حكم شرعي.</p>`},
{c:2,s:'new',t:'essay',q:'اذكر ضربي تعريف أتباع المذاهب بمذهبهم.',ans:`<ol><li>الإشارة إلى ذلك في مقدمة كتاب عام في فقه المذهب.</li><li>إفراد كتاب خاص للتعريف بإمام المذهب أو بمصطلحاته.</li></ol>`},

{c:3,s:'new',t:'mcq',q:'الاكتفاء بالنضح في بول الصبي الذكر من صور:',o:['تشريع البدائل لما يتعذر فعله','إيجاد الكفارات','التيسير فيما تعم به البلوى','وجوب الأخذ بالرخصة عند الضرر'],a:2,e:'ومثله وقوع الذباب في الماء لا ينجسه لعسر الاحتراز عنه.'},
{c:3,s:'new',t:'mcq',q:'حديث معاذ بن جبل حين بعثه النبي صلى الله عليه وسلم إلى اليمن دليل على:',o:['التدرج في النواهي','التدرج في الأوامر','النسخ','المرونة'],a:1,e:'الترتيب في الدعوة: التوحيد، ثم الصلاة، ثم الزكاة. أما قول عائشة فدليل التدرج في النواهي.'},

{c:3,s:'new',t:'mcq',q:'الاستثناء من الأحكام الشرعية يلحق:',o:['الأشخاص لا الأوصاف','الأوصاف لا الأشخاص','الأشراف دون الضعفاء','القرابة دون غيرهم'],a:1,e:'لا يُستثنى أحد لسبب شخصي، بل لسبب موضوعي كانتفاء شرط أو وجود مانع.'},
{c:3,s:'new',t:'mcq',q:'المستشرق اليهودي الذي تولى كِبر فرية تأثر الفقهاء بالقانون الروماني:',o:['جرجي زيدان','سليم باز','جولد تسيهر','جستنيان'],a:2,e:'ومعه المستشرق شاخت. أما جرجي زيدان وسليم باز فشهادتهما لصالح الفقه.'},
{c:3,s:'new',t:'mcq',q:'مدرسة قانونية دُمّرت بزلزال قبل عام الفيل بنحو 20 سنة:',o:['الإسكندرية','بيروت','روما','القسطنطينية'],a:1,e:'والإسكندرية أُغلقت بأمر بيزنطي قبل عام الفيل بنحو 38 سنة.'},
{c:3,s:'new',t:'mcq',q:'كانت رحلة النبي صلى الله عليه وسلم الأولى إلى الشام:',o:['في تجارة خديجة رضي الله عنها','صغيراً مع عمه أبي طالب','بعد البعثة بسنتين','مع رفقة من تجار الروم'],a:1,e:'والرحلة الثانية كانت في تجارة خديجة مع رفقة من العرب الخلص.'},
{c:3,s:'new',t:'mcq',q:'الإذن في الانتباذ في أي إناء بعد النهي عنه مثال على خاصية:',o:['رعاية مصالح الناس','تحقيق العدل بين الناس','العبودية لله وحده','المرونة والسعة'],a:0,e:'ومثلها زيارة القبور وادخار لحوم الأضاحي.'},
{c:3,s:'new',t:'essay',q:'اذكر دليلاً من القرآن ودليلاً من السنة على خاصية السماحة ورفع الحرج.',ans:`<p><b>من القرآن:</b> ﴿يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ﴾ [البقرة: 185].</p><p><b>من السنة:</b> قول عائشة: «ما خُيِّر رسول الله صلى الله عليه وسلم بين أمرين إلا اختار أيسرهما، ما لم يكن إثماً».</p>`},
{c:3,s:'new',t:'essay',q:'اذكر أربعاً من صور السماحة في الفقه الإسلامي مع التمثيل.',ans:`<ol><li><b>التيسير فيما تعم به البلوى:</b> النضح لبول الصبي الذكر، والذباب لا ينجس الماء.</li><li><b>إيجاد الكفارات:</b> ككفارة الظهار.</li><li><b>تشريع البدائل:</b> كالتيمم بدلاً عن الوضوء.</li><li><b>وجوب الأخذ بالرخصة</b> إذا خاف المكلف على نفسه الضرر.</li></ol>`},
{c:3,s:'new',t:'essay',q:'اذكر الضروريات الخمس على الترتيب، وبيّن القاعدة عند تعارضها.',ans:`<p>الدين، النفس، العقل، العرض، المال.</p><p><b>القاعدة:</b> إذا كان حفظ ضرورة سبباً في ضياع ضرورة أعلى منها، سقط الحكم ارتكاباً لأخف الضررين، كالتخلي عن المال لبقاء الروح.</p>`},
{c:3,s:'new',t:'essay',q:'اذكر دليلين على خاصية تحقيق العدل في الفقه الإسلامي.',ans:`<ol><li>﴿إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ﴾ [النحل: 90].</li><li>حديث المرأة المخزومية: «...وايم الله، لو أن فاطمة بنت محمد سرقت لقطعت يدها».</li></ol><p class="note">ويصح ذكر خطبة حجة الوداع حين وضع ربا العباس ودم ابن ربيعة بن الحارث مبتدئاً بقرابته.</p>`},
{c:3,s:'new',t:'essay',q:'اذكر الدليل على التدرج في الأوامر، والدليل على التدرج في النواهي.',ans:`<p><b>في الأوامر:</b> حديث معاذ: «...فليكن أول ما تدعوهم إليه عبادة الله، فإذا عرفوا الله، فأخبرهم أن الله قد فرض عليهم خمس صلوات... فإذا فعلوا، فأخبرهم أن الله فرض عليهم زكاة...».</p><p><b>في النواهي:</b> قول عائشة: «إنما نزل أول ما نزل سورة من المفصل فيها ذكر الجنة والنار... ولو نزل أول شيء: لا تشربوا الخمر، لقالوا: لا ندع الخمر أبداً...».</p>`},

{c:4,s:'new',t:'mcq',q:'قوله صلى الله عليه وسلم في الهرة: «إنها ليست بنجس، إنها من الطوافين عليكم» من منهجه في:',o:['بيان الحكم بقاعدة كلية','بيان الحكم مقروناً بعلته','القيام بالعمل ليتبعه الصحابة','نسخ الحكم السابق'],a:1,e:'أما «إنما الأعمال بالنيات» فبيان الحكم بقاعدة كلية.'},

{c:4,s:'new',t:'mcq',q:'التحريم الجازم البات للخمر كان في غزوة:',o:['بدر','أحد','بني النضير','بني قريظة'],a:2,e:'بقوله تعالى: ﴿إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنصَابُ وَالْأَزْلَامُ رِجْسٌ...﴾.'},
{c:4,s:'new',t:'mcq',q:'اجتهد عمرو بن العاص في حياة النبي صلى الله عليه وسلم في:',o:['الحكم في بني قريظة بعد الغزوة','التيمم من الجنابة في الليلة الباردة','النزول عند ماء بدر قبل المعركة','قسمة الغنائم بين المقاتلين'],a:1,e:'أما سعد بن معاذ فاجتهد في بني قريظة.'},
{c:4,s:'new',t:'essay',q:'عرّف العهد النبوي، وبيّن سبب كونه أهم العصور الفقهية.',ans:`<p><b>العهد النبوي:</b> الزمن الممتد من بعثة النبي صلى الله عليه وسلم قبل الهجرة بثلاثة عشر عاماً، إلى وفاته في ربيع الأول من السنة الحادية عشرة للهجرة.</p><p><b>أهميته:</b> التشريع (القرآن والسنة) تم فيه واكتمل، وشُيدت فيه أصول الدين وقواعد التشريع وأصول الأدلة، وفيه وفرة النصوص التفصيلية، وهو أساس الفقه في كل العصور اللاحقة.</p>`},
{c:4,s:'new',t:'essay',q:'اذكر أوجه علاقة السنة بالقرآن، مع التمثيل لكل وجه.',ans:`<ol><li><b>موافقة (مؤكدة):</b> الأمر بالصلاة والزكاة، وأكدته السنة: «بُني الإسلام على خمس».</li><li><b>مبيِّنة، على أربع صور:</b> تفسير المجمل (مواقيت الصلاة وصفتها)، تقييد المطلق (الوصية بالثلث)، تخصيص العام (لا يرث المسلم الكافر)، توضيح المشكل (الخيط الأبيض والأسود).</li><li><b>مستقلة (مؤسِّسة):</b> «يحرم من الرضاع ما يحرم من النسب».</li></ol>`},
{c:4,s:'new',t:'essay',q:'اذكر حكم تنجيم القرآن الكريم، مع ذكر دليل الحكمة الأولى.',ans:`<ol><li><b>تثبيت فؤاد النبي صلى الله عليه وسلم:</b> ﴿وَقَالَ الَّذِينَ كَفَرُوا لَوْلَا نُزِّلَ عَلَيْهِ الْقُرْآنُ جُمْلَةً وَاحِدَةً كَذَٰلِكَ لِنُثَبِّتَ بِهِ فُؤَادَكَ وَرَتَّلْنَاهُ تَرْتِيلًا﴾ [الفرقان: 32].</li><li>تيسير حفظ القرآن وتدبر معانيه.</li><li>مسايرة الحوادث ومواكبة الوقائع.</li><li>التدرج في التشريع.</li></ol>`},
{c:4,s:'new',t:'essay',q:'اذكر خصائص التشريع في العهد النبوي، واذكر دليل اكتمال التشريع.',ans:`<ol><li>التدرج في التشريع.</li><li>النسخ.</li><li>واقعية التشريع.</li><li>اكتمال التشريع بوفاة النبي صلى الله عليه وسلم.</li></ol><p><b>الدليل:</b> ﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا﴾ [المائدة: 3].</p>`},
{c:4,s:'new',t:'essay',q:'اذكر الدليل من القرآن على وجوب اتباع السنة.',ans:`<p>﴿وَمَا آتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانتَهُوا﴾ [الحشر: 7].</p>`},
{c:4,s:'new',t:'essay',q:'اذكر مراحل تحريم الخمر مع الدليل لكل مرحلة.',ans:`<ol><li><b>بيان أن إثمها أكبر من نفعها:</b> ﴿يَسْأَلُونَكَ عَنِ الْخَمْرِ وَالْمَيْسِرِ قُلْ فِيهِمَا إِثْمٌ كَبِيرٌ...﴾ [البقرة: 219].</li><li><b>تحريمها في أوقات الصلاة:</b> ﴿لَا تَقْرَبُوا الصَّلَاةَ وَأَنتُمْ سُكَارَىٰ...﴾ [النساء: 43].</li><li><b>التحريم الجازم في غزوة بني النضير:</b> ﴿إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنصَابُ وَالْأَزْلَامُ رِجْسٌ مِّنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ﴾ [المائدة: 90].</li></ol>`},
{c:4,s:'new',t:'essay',q:'هل كان الاجتهاد مصدراً ثالثاً من مصادر التشريع في العهد النبوي؟ وضّح.',ans:`<p><b>لا.</b> فالاجتهاد في زمن النبوة ضربان:</p><ol><li><b>اجتهاد النبي صلى الله عليه وسلم:</b> فيما يبلّغ عن ربه تشريع ملزم من سنته، وفيما تختلف فيه الأحوال (ماء بدر) أو الخبرة (تأبير النخل) ليس تشريعاً.</li><li><b>اجتهاد الصحابة في حياته:</b> (سعد بن معاذ، عمرو بن العاص) يدخل في سنته بإقراره أو تخطئته.</li></ol><p>فمصادر التشريع منحصرة في الكتاب والسنة.</p>`},

{c:5,s:'new',t:'mcq',q:'جُمع المصحف بعد أن كثر الشهداء من القراء أيام حرب المرتدين، في عهد:',o:['عثمان بن عفان','أبي بكر الصديق','عمر بن الخطاب','علي بن أبي طالب'],a:1,e:'أما نسخ المصاحف وإرسالها للأمصار ففي عهد عثمان.'},
{c:5,s:'new',t:'mcq',q:'شهد مع المغيرة بن شعبة أن النبي صلى الله عليه وسلم أعطى الجدة السدس:',o:['أبو سعيد الخدري','محمد بن مسلمة','أبو موسى الأشعري','عبدالرحمن بن عوف'],a:1,e:'وأبو سعيد الخدري شهد لأبي موسى في حديث الاستئذان عند عمر.'},
{c:5,s:'new',t:'mcq',q:'استحداث عثمان الأذان الثاني للجمعة حين كثر الناس من الاجتهاد في:',o:['فهم النصوص','الاستنباط من النصوص','استخراج أحكام ما لا نص فيه','تنزيل الأحكام على الوقائع'],a:2,e:'أنواع الاجتهاد الأربعة: فهم النصوص، الاستنباط، ما لا نص فيه، التنزيل على الوقائع.'},
{c:5,s:'new',t:'mcq',q:'منع الصحابة سهم المؤلفة قلوبهم حين زال موجب الإعطاء، وهذا من الاجتهاد في:',o:['فهم النصوص','الاستنباط من النصوص','استخراج أحكام ما لا نص فيه','تنزيل الأحكام على الوقائع'],a:3,e:'تنزيل الأحكام على الوقائع.'},
{c:5,s:'new',t:'mcq',q:'من صلّى العصر في الطريق قبل بني قريظة من الصحابة هم سلف:',o:['أهل الظاهر','أصحاب المعاني والقياس','المقلين في الفتيا والرأي','أهل الحديث والأثر'],a:1,e:'نظروا إلى المعنى، ومن أخّرها نظر إلى اللفظ فهم سلف أهل الظاهر.'},
{c:5,s:'new',t:'mcq',q:'فسّر القرء بالطهر من الصحابة:',o:['عمر وعلي وابن مسعود','عائشة وابن عمر وزيد بن ثابت','ابن مسعود وأبو موسى وعلي','علي والزبير وعثمان'],a:1,e:'وفسّره بالحيض: عمر، وعلي، وابن مسعود، وأبو موسى.'},
{c:5,s:'new',t:'mcq',q:'أصعب مراتب الخلاف بين الصحابة وأوعرها:',o:['تفاوتهم في الرواية','اختلافهم في تفسير النصوص','الاجتهاد فيما ليس فيه نص','العلم بالناسخ والمنسوخ'],a:2,e:'ومثاله قسمة سواد العراق.'},
{c:5,s:'new',t:'mcq',q:'رجوع أبيّ بن كعب عن القول بحديث «إنما الماء من الماء» مثال على تفاوت الصحابة في:',o:['المنزلة العلمية وملكة الاجتهاد','العلم بالناسخ والمنسوخ','طرق دفع التعارض','تفسير النصوص المجملة'],a:1,e:'كانت رخصة في أول الإسلام، ثم أُمروا بالاغتسال.'},
{c:5,s:'new',t:'mcq',q:'توقف عثمان في الجمع بين الأختين بملك اليمين، ومنعه علي والزبير، وهذا من اختلافهم في:',o:['تفسير النصوص المحتملة لأكثر من وجه','طرق دفع التعارض بين ظواهر النصوص','العلم بالناسخ والمنسوخ','الرواية عن النبي صلى الله عليه وسلم'],a:1,e:'منعا لأن آية التحريم أخص.'},
{c:5,s:'new',t:'mcq',q:'عدد من حُفظت عنهم الفتوى من الصحابة:',o:['مائة وعشرون ونيّف','مائة وثلاثون ونيّف','مائتان ونيّف','سبعون ونيّف'],a:1,e:'ومنهم سبعة مكثرون.'},
{c:5,s:'new',t:'mcq',q:'المقدَّم في الفتيا من الصحابة بالبصرة:',o:['أنس بن مالك','أبو موسى الأشعري','عمران بن حصين','ابن عباس'],a:1,e:'وفي الكوفة ابن مسعود.'},
{c:5,s:'new',t:'mcq',q:'أول اسم عُرف به فقهاء الصحابة:',o:['العلماء','الفقهاء','القرّاء','المجتهدون'],a:2,e:'تطور الاسم: القرّاء ثم العلماء ثم الفقهاء.'},
{c:5,s:'new',t:'mcq',q:'من المصنفات المسندة في فقه الصحابة:',o:['فتح الباري لابن حجر','شرح صحيح مسلم للنووي','الموطأ للإمام مالك','جميع ما ذكر'],a:2,e:'المسندة: الموطأ، والأم، وسنن أبي داود، وسنن الترمذي. وغير المسندة: شرح النووي، وفتح الباري.'},
{c:5,s:'new',t:'mcq',q:'قول عمر (مقاطع الحقوق عند الشروط) مثال على أن أقوال الصحابة تتميز بـ:',o:['السهولة والإيجاز مع وضوح المعنى','غلبة الجانب النظري على التطبيقي','كونها بمنزلة المرفوع إلى النبي','كثرة التفريع وافتراض المسائل'],a:0,e:'فكانت قاعدة فقهية في كثير من المسائل.'},
{c:5,s:'new',t:'essay',q:'اذكر الدليل على أن عصر الصحابة امتداد لعصر النبوة، وبيّن وجه الدلالة.',ans:`<p>حديث العرباض بن سارية: «عليكم بسنتي وسنة الخلفاء الراشدين المهديين من بعدي، عضوا عليها بالنواجذ».</p><p><b>وجه الدلالة:</b> يرشد إلى سعة إحاطتهم بما كان عليه الرسول صلى الله عليه وسلم، وشدة تمسكهم به، ولذلك طُلب الاقتداء بهم.</p>`},
{c:5,s:'new',t:'essay',q:'اذكر أنواع الاجتهاد التي مارسها الصحابة، مع التمثيل لكل نوع.',ans:`<ol><li><b>في فهم النصوص:</b> أبو بكر وتفسير الكلالة.</li><li><b>في الاستنباط من النصوص:</b> علي وأقل مدة الحمل.</li><li><b>في استخراج أحكام ما لا نص فيه:</b> عثمان والأذان الثاني للجمعة.</li><li><b>في تنزيل الأحكام على الوقائع:</b> منع سهم المؤلفة قلوبهم.</li></ol>`},
{c:5,s:'new',t:'essay',q:'عدّد أسباب قلة الخلاف بين الصحابة.',ans:`<ol><li>صلاح قصدهم في طلب الحق.</li><li>حسن تفقههم.</li><li>صفاء بصيرتهم.</li><li>ممارستهم الاجتهاد وفق الأصول التي أخذوها عن النبي صلى الله عليه وسلم مباشرة.</li><li>أن اجتهادهم كان واقعياً لا مفترضاً.</li><li>إعمالهم مبدأ الشورى وحرصهم على اجتماع القلوب.</li></ol>`},
{c:5,s:'new',t:'essay',q:'اذكر أسباب الخلاف الفقهي بين الصحابة.',ans:`<ol><li>تفاوتهم في الرواية عن النبي صلى الله عليه وسلم.</li><li>تفاوتهم في المنزلة العلمية وملكة الاجتهاد.</li><li>تفاوتهم في العلم بالناسخ والمنسوخ.</li><li>اختلافهم في طرق دفع التعارض بين ظواهر النصوص.</li><li>اختلافهم في تفسير النصوص.</li><li>اختلافهم في الاجتهاد فيما ليس فيه نص.</li></ol>`},
{c:5,s:'new',t:'essay',q:'اذكر قسمي الخلاف الفقهي بين الصحابة، مع التمثيل للأول.',ans:`<ol><li><b>خلاف يرتفع بظهور النص البيّن</b> فتجتمع كلمتهم: ومثاله الدخول على بلد فيه الطاعون، حين روى عبدالرحمن بن عوف: «إذا سمعتم به بأرض فلا تقدموا عليه...».</li><li><b>خلاف لا يرتفع وتبقى دواعيه</b> لكونه مبنياً على مناطات متعددة من النصوص ومقاصد الشريعة.</li></ol>`},
{c:5,s:'new',t:'essay',q:'اذكر المكثرين من الفتيا من الصحابة.',ans:`<p>عمر، وعلي، وابن مسعود، وعائشة، وابن عباس، وابن عمر، وزيد بن ثابت.</p>`},
{c:5,s:'new',t:'essay',q:'اذكر المصنفات المسندة وغير المسندة من مظانّ فقه الصحابة.',ans:`<p><b>المسندة:</b> الموطأ للإمام مالك، والأم للشافعي، وسنن أبي داود، وسنن الترمذي.</p><p><b>غير المسندة:</b> شرح صحيح مسلم للنووي، وفتح الباري لابن حجر (شرح صحيح البخاري).</p>`},
// عصر التابعين
{c:6,s:'new',t:'mcq',q:'من عوامل اتساع الاجتهاد في عصر التابعين:',o:['قلة الوقائع','كثرة الوقائع التي تستجد للناس','قوة الاتصال العلمي بين الفقهاء','ثبات أنماط الحياة'],a:1,e:'وعوامله: كثرة الوقائع، واتساع رقعة البلاد، وتغير أنماط الحياة.'},
{c:6,s:'new',t:'mcq',q:'ظهور الوضع في أحاديث رسول الله صلى الله عليه وسلم استتبع:',o:['تدوين الفقه','تدوين السنة','نشأة المذاهب','جمع المصحف'],a:1,e:'تصدى العلماء بتمحيص الأحاديث، مما استتبع تدوين السنة.'},
{c:6,s:'new',t:'mcq',q:'من شواهد نسخ النهي عن كتابة الحديث في آخر العهد النبوي:',o:['أمره بالكتابة لأبي شاه','مكاتبته الملوك','إقراره صحيفة عبدالله بن عمرو','جميع ما ذكر'],a:3,e:'ومنها أيضاً مكاتبته ولاته وقضاته.'},
{c:6,s:'new',t:'mcq',q:'سبب عدم تدوين السنة تدويناً عاماً في عهد الصحابة:',o:['النهي الصريح الباقي عن الكتابة','خشية التباسها بالقرآن','قلة الكتّاب','انشغالهم بالفتوحات'],a:1,e:'كان الناس حديثي عهد بالقرآن.'},
{c:6,s:'new',t:'mcq',q:'كتب عمر بن عبدالعزيز يأمر بتدوين السنة إلى:',o:['أبي بكر ابن حزم وابن شهاب الزهري','سعيد بن المسيب وسالم بن عبدالله','إبراهيم النخعي وحماد بن أبي سليمان','مكحول الشامي وابن شهاب الزهري'],a:0,e:'ابن حزم عامله وقاضيه على المدينة، والزهري عالم الحجاز والشام.'},
{c:6,s:'new',t:'mcq',q:'التدوين الفقهي في عصر التابعين:',o:['بلغ ذروته','لم يُعرف','كان مختلطاً بالحديث','كان رسمياً بأمر الخليفة'],a:1,e:'بقيت آراؤهم في الصدور، سوى ما يُنقل عن مكحول الشامي من كتاب في المناسك.'},
{c:6,s:'new',t:'mcq',q:'تعود بذرة مدرسة أهل الحديث إلى الصحابي:',o:['عبدالله بن مسعود','عبدالله بن عمر','عبدالله بن عباس','علي بن أبي طالب'],a:1,e:'وبذرة مدرسة الرأي تعود إلى عبدالله بن مسعود.'},
{c:6,s:'new',t:'mcq',q:'من التابعين الذين توسعت بهم مدرسة أهل الرأي:',o:['سالم بن عبدالله','الزهري','إبراهيم النخعي','سعيد بن المسيب'],a:2,e:'ومعه حماد بن أبي سليمان. وسالم والزهري من مدرسة الحديث.'},
{c:6,s:'new',t:'mcq',q:'الفقه الافتراضي (التقديري) ارتبط في نشأته بمدرسة:',o:['أهل الحديث','أهل الرأي','أهل الظاهر','أهل المدينة'],a:1,e:'نتج عن كثرة التفريعات في العراق وافتراض مسائل لم تقع.'},
{c:6,s:'new',t:'essay',q:'اذكر معالم الفقه في عصر التابعين.',ans:`<ol><li>اتساع الاجتهاد، وكثرة الاختلافات الفقهية.</li><li>ظهور الاستدلال بأقوال الصحابة وفتاويهم.</li><li>ظهور الوضع في أحاديث رسول الله صلى الله عليه وسلم.</li><li>بروز ظاهرة فقه البلدان.</li><li>تشكّل المدارس الفقهية (الحديث والرأي).</li></ol>`},
{c:6,s:'new',t:'essay',q:'اذكر أسباب انتشار كتابة الحديث في عصر التابعين.',ans:`<ol><li>أن مرور الزمن كان كفيلاً بتثبيت القرآن في النفوس فلا يلتبس بغيره.</li><li>ذهاب كثير من حملة الحديث في الحروب والفتوحات، وظهور الكذب في الحديث.</li><li>توسع دولة الإسلام واختلاط العرب بالأعاجم، فقلّ الضبط لضعف ملكة الحفظ.</li><li>انتشار الروايات، وطول الأسانيد، وكثرة أسماء الرواة.</li></ol>`},
{c:6,s:'new',t:'essay',q:'قارن بين مدرسة أهل الحديث ومدرسة أهل الرأي من حيث: المركز، والسمة، والبذرة، وأبرز الأئمة.',ans:`<p><b>مدرسة أهل الحديث:</b> مركزها المدينة، تميزت بشدة العناية بالأحاديث وتقديمها على الرأي، وبذرتها عبدالله بن عمر، وتميزت على أيدي مالك والشافعي وأحمد.</p><p><b>مدرسة أهل الرأي:</b> مركزها الكوفة، تميزت بكثرة القياس والتفريع وافتراض المسائل، وبذرتها عبدالله بن مسعود، وتميزت على أيدي أبي حنيفة وأصحابه.</p>`},
{c:6,s:'new',t:'essay',q:'اذكر شواهد نسخ النهي عن كتابة الحديث.',ans:`<ol><li>أمره صلى الله عليه وسلم في فتح مكة أن يكتبوا لأبي شاه.</li><li>مكاتبته الملوك يدعوهم للإسلام.</li><li>مكاتبته بعض ولاته وقضاته في الصدقات والديات والفرائض.</li><li>إقراره صحيفة عبدالله بن عمرو بن العاص.</li></ol>`},
{c:6,s:'new',t:'essay',q:'بيّن أهمية الدور الذي قام به التابعون.',ans:`<ol><li>جمع وحفظ ما رُوي عن النبي صلى الله عليه وسلم من أحاديث، وجمع فتاوى الصحابة واجتهاداتهم.</li><li>الاجتهاد في معرفة حكم النوازل التي لم يرد فيها نص ولا قول للصحابة، دون الخروج عن منهج الصحابة.</li></ol>`},
// عصر الأئمة
{c:7,s:'new',t:'mcq',q:'أول من ألّف في علم القواعد الفقهية استقلالاً:',o:['الإمام الشافعي','أبو الحسن الكرخي','الإمام مالك','ابن خلدون'],a:1,e:'ومعه أبو الليث السمرقندي، وبلغت المؤلفات أوجها في القرن الثامن.'},
{c:7,s:'new',t:'mcq',q:'بلغت المؤلفات في علم القواعد الفقهية أوجها في القرن:',o:['الرابع','السادس','الثامن','العاشر'],a:2,e:'القرن الثامن الهجري.'},
{c:7,s:'new',t:'mcq',q:'تناظر الإمام مالك والليث بن سعد بالمكاتبة في:',o:['حجية القياس','حجية عمل أهل المدينة','حجية الحديث المرسل','حكم التمذهب'],a:1,e:'وهذا من شيوع الجدل والمناظرات، أحد عوامل نشاط الحركة العلمية.'},
{c:7,s:'new',t:'mcq',q:'«الموطأ» للإمام مالك و«الأم» للإمام الشافعي مثال على تدوين الفقه:',o:['مجرداً من الحديث والأثر','مختلطاً بالحديث والأثر','بالأدلة مقارناً بأقوال الفقهاء','على طريقة القواعد'],a:1,e:'أما المجرد من الحديث فمثاله بعض كتب ظاهر الرواية لمحمد بن الحسن.'},
{c:7,s:'new',t:'mcq',q:'الفقه الذي يفرض ويناقش المسائل التي لم تقع، تهيؤاً لوقوعها وتمريناً للطلبة:',o:['الفقه المقارن (فقه الخلاف)','الفقه الافتراضي التقديري','فقه النوازل الفقهية','فقه البلدان والأمصار'],a:1,e:'وُجد قبل أبي حنيفة، لكنه نمّاه ووسّعه.'},
{c:7,s:'new',t:'mcq',q:'تتلمذ محمد بن الحسن الشيباني صاحب أبي حنيفة على:',o:['الإمام مالك في المدينة','الإمام الشافعي في العراق','الإمام أحمد في بغداد','الليث بن سعد في مصر'],a:0,e:'ثم التقى به الشافعي في العراق، والتقى أحمد بالشافعي.'},
{c:7,s:'new',t:'mcq',q:'الشافعي أول من صنّف في أصول الفقه، وهذا يعني أنه:',o:['ابتدع هذا العلم','أول من دوّنه وأظهره','نقله عن مالك','جمعه من كتب التابعين'],a:1,e:'كان هذا العلم في صدور الصحابة والمجتهدين قبله.'},
{c:7,s:'new',t:'essay',q:'اذكر أبرز معالم عصر الأئمة المجتهدين.',ans:`<ol><li>اكتمال تدوين السنة بأنواعها كالجوامع والسنن.</li><li>تمايز العلوم الشرعية، وبروز التخصصات.</li><li>العناية بأصول العلوم الشرعية والتأليف فيها، ووضع قواعد الاجتهاد.</li><li>نشاط الحركة العلمية والفقهية.</li><li>نشاط حركة تدوين العلوم.</li><li>بروز ظاهرة الفقه الافتراضي التقديري.</li><li>نشأة المذاهب الفقهية الأربعة.</li></ol>`},
{c:7,s:'new',t:'essay',q:'اذكر عوامل نشاط الحركة العلمية والفقهية في عصر الأئمة المجتهدين.',ans:`<ol><li>ما كان عليه المجتمع العلمي من بلوغ الذروة في الاجتهاد والنبوغ.</li><li>عناية الخلفاء العباسيين بالعلم والفقهاء، ومنه تولي أبي يوسف رئاسة القضاة.</li><li>تدوين العلوم الشرعية واللغوية.</li><li>شيوع الجدل والمناظرات، كمكاتبة مالك والليث في حجية عمل أهل المدينة.</li><li>كثرة النوازل بسبب توسع الدولة.</li></ol>`},
{c:7,s:'new',t:'essay',q:'أكمل الفراغ: يبتدئ عصر الأئمة المجتهدين من ............، وينتهي في ............، ويسمى أيضاً ............ و............',ans:`<p>يبتدئ من <b>أوائل القرن الثاني الهجري</b>، وينتهي في <b>منتصف القرن الرابع الهجري</b>، ويسمى <b>عصر نشأة المذاهب الفقهية</b> و<b>عصر التدوين</b>.</p>`},
// المذاهب
{c:8,s:'new',t:'mcq',q:'(المنهج الذي سلكه فقيه مجتهد اختص به من بين الفقهاء، أدى به إلى استنباط جملة من الأحكام الاجتهادية) تعريف:',o:['التمذهب','المذهب الفقهي','المدرسة الفقهية','فقه البلدان'],a:1,e:'والتمذهب: التزام غير المجتهد مذهب مجتهد معين.'},
{c:8,s:'new',t:'mcq',q:'وجوب الصلاة يُنسب إلى:',o:['مذهب الإمام مالك وأصحابه','الشرع، فهو مذهب إجماع الأمة','المذهب الحنبلي خاصة','جمهور الفقهاء دون غيرهم'],a:1,e:'القطعيات لا تُنسب لمذهب، قال القرافي: هذه الأمور مذهب إجماع من الأمة المحمدية.'},
{c:8,s:'new',t:'mcq',q:'اللبنتان الأوليان للتمذهب:',o:['فقه الصحابة في البلدان، والمدارس الفقهية','المذاهب الأربعة الباقية، والمذاهب المندثرة','تدوين السنة النبوية، وتدوين الفقه','القواعد الفقهية، وعلم أصول الفقه'],a:0,e:'لم يوجد قبل نشأة المذاهب تمذهب بمعناه المعهود.'},
{c:8,s:'new',t:'mcq',q:'اعتمد أهل الشام في عصر الصحابة على فتاوى:',o:['ابن عباس وابن عمر','علي وابن مسعود','معاذ بن جبل وأبي الدرداء','عمرو بن العاص وابنه عبدالله'],a:2,e:'المدينة: ابن عمر وزيد وعائشة. مكة: ابن عباس. الكوفة: علي وابن مسعود. مصر: عمرو بن العاص وابنه.'},
{c:8,s:'new',t:'mcq',q:'(الليث أفقه من مالك، إلا أن أصحابه لم يقوموا به) قالها:',o:['الإمام أحمد','الإمام الشافعي','ابن المبارك','ابن خزيمة'],a:1,e:'وهي دليل على أن سبب الاندثار عدم وجود التلاميذ.'},
{c:8,s:'new',t:'mcq',q:'كان يرى عدم وجوب النية في الوضوء لأنها لم ترد في آية الوضوء:',o:['الأوزاعي','سفيان الثوري','الليث بن سعد','داود الظاهري'],a:1,e:'وكان يميل في اجتهاده لطريقة أهل الكوفة.'},
{c:8,s:'new',t:'mcq',q:'إمام أهل الشام، روي أنه أفتى في سبعين ألف مسألة:',o:['الأوزاعي','سفيان الثوري','الليث بن سعد','سفيان بن عيينة'],a:0,e:'قال فيه مالك: كان الأوزاعي إماماً يُقتدى به.'},
{c:8,s:'new',t:'mcq',q:'قال بجواز بيع جلود الميتة من الدباغين إذا بُيّن أنها ميتة:',o:['الليث بن سعد','الأوزاعي','داود الظاهري','ابن جرير الطبري'],a:0,e:'لأن النبي صلى الله عليه وسلم أذن في الانتفاع بها.'},
{c:8,s:'new',t:'mcq',q:'يحيى بن يحيى الليثي صاحب مالك:',o:['تولى رئاسة القضاء في الدولة العباسية','كان مكيناً عند والي الأندلس ولم يلِ القضاء','أسس المدرسة النظامية في بغداد','ألّف أول كتاب في القواعد الفقهية'],a:1,e:'كان لا يلي قاضٍ إلا بمشورته.'},
{c:8,s:'new',t:'mcq',q:'المدرسة النظامية في بغداد من مدارس المذهب:',o:['الحنفي','المالكي','الشافعي','الحنبلي'],a:2,e:'ومن مدارس الشافعية أيضاً الناصرية بمصر.'},
{c:8,s:'new',t:'mcq',q:'حكم التزام التمذهب في القضاء والإفتاء:',o:['مذموم شرعاً','لا حرج فيه','محرم مطلقاً','مكروه'],a:1,e:'يشهد له عمل المسلمين عبر القرون دون نكير.'},
{c:8,s:'new',t:'mcq',q:'من الأصول الخاصة المختلف فيها بين الأئمة:',o:['القياس','الإجماع','سد الذرائع','السنة النبوية'],a:2,e:'المختلف فيها: الاستحسان، والمصالح المرسلة، وعمل أهل المدينة، وقول الصحابي، وسد الذرائع، وشرع من قبلنا.'},
{c:8,s:'new',t:'essay',q:'عرّف المذهب الفقهي والتمذهب، وبيّن مجال التمذهب.',ans:`<p><b>المذهب الفقهي:</b> المنهج الذي سلكه فقيه مجتهد اختص به من بين الفقهاء المجتهدين، أدى به إلى استنباط جملة من الأحكام الاجتهادية من الأدلة المعتبرة.</p><p><b>التمذهب:</b> التزام غير المجتهد مذهب مجتهد معين في الأصول والفروع أو في أحدهما.</p><p><b>مجاله:</b> المسائل الاجتهادية، أما القطعيات والمعلوم من الدين بالضرورة فمنسوبة إلى الشرع.</p>`},
{c:8,s:'new',t:'essay',q:'اذكر أسباب بقاء المذاهب الفقهية الأربعة دون غيرها.',ans:`<ol><li>التلاميذ النجباء.</li><li>تبني الدول للمذهب (تعيين القضاة، وتولية الإفتاء).</li><li>المدارس المذهبية.</li><li>الأوقاف على أرباب المذاهب.</li></ol>`},
{c:8,s:'new',t:'essay',q:'اذكر أسباب التمذهب بأحد المذاهب الفقهية المتبوعة.',ans:`<ol><li>أن مجموع ما في المذاهب المتبوعة يمثل فقه الشريعة في الجملة.</li><li>أن التفقه بالترقي في المذهب من أفضل الطرق وأقصرها.</li><li>ثروة المدونات المذهبية بالمسائل الفقهية.</li><li>أن مجانبة التفقه المذهبي قد تفضي إلى التفلت والشذوذ.</li></ol>`},
{c:8,s:'new',t:'essay',q:'اذكر المذاهب الفقهية الباقية، مع اسم الإمام وسنة وفاته.',ans:`<ol><li>الحنفي: أبو حنيفة النعمان بن ثابت (150هـ).</li><li>المالكي: مالك بن أنس (179هـ).</li><li>الشافعي: محمد بن إدريس الشافعي (204هـ).</li><li>الحنبلي: أحمد بن حنبل (241هـ).</li></ol>`},
{c:8,s:'new',t:'essay',q:'اذكر الأصول الخاصة التي اختلف فيها الأئمة إلى جانب الأدلة الأربعة.',ans:`<ol><li>الاستحسان</li><li>المصالح المرسلة</li><li>عمل أهل المدينة</li><li>قول الصحابي</li><li>سد الذرائع</li><li>شرع من قبلنا</li></ol>`},
{c:8,s:'new',t:'essay',q:'اذكر مسألتين خالف فيهما داود الظاهري جماهير أهل العلم، مع دليله.',ans:`<ol><li><b>جواز مس المصحف للحائض والجنب:</b> لأن النبي صلى الله عليه وسلم كتب في كتابه آية إلى قيصر، فإذا جاز للكافر فالمسلم أولى.</li><li><b>جواز قراءة الجنب للقرآن:</b> لحديث عائشة: «كان النبي صلى الله عليه وسلم يذكر الله على كل أحيانه»، والقرآن ذكر. والجمهور على أنه لا يجوز.</li></ol>`}
];
const L=['أ','ب','ج','د','هـ'];
const S={mode:'train',src:'all',typ:'mcq',chap:new Set(),seed:Date.now()};
const st={}; // answers per question index
let examSet=null, examDone=false;
try{const p=JSON.parse(localStorage.getItem('qb-f')||'{}');if(p.src)S.src=p.src;if(p.typ)S.typ=p.typ;if(p.chap)S.chap=new Set(p.chap)}catch(e){}
function save(){try{localStorage.setItem('qb-f',JSON.stringify({src:S.src,typ:S.typ,chap:[...S.chap]}))}catch(e){}}
Q.forEach((q,i)=>{q.i=i;if(q.t==='mcq'){const fixed=q.o===TF||q.o.some(o=>/جميع|لا شيء|أ\+ب/.test(o));q.ord=fixed?q.o.map((_,k)=>k):shuffle(q.o.map((_,k)=>k),i*7919+13)}});
function shuffle(a,seed){let s=seed%2147483647||1;const r=()=>(s=s*16807%2147483647)/2147483647;for(let k=a.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function pool(t){return Q.filter(q=>(S.src==='all'||q.s===S.src)&&(!t||q.t===t)&&(S.chap.size===0||S.chap.has(q.c)))}
function segs(){for(const id of ['mode','src','typ']){document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S[id==='typ'?'typ':id])))}
  document.getElementById('typeRow').hidden=S.mode==='exam'}
function chips(){const box=document.getElementById('chap');box.innerHTML='';
  const base=Q.filter(q=>(S.src==='all'||q.s===S.src)&&(S.mode==='exam'||q.t===S.typ));
  const mk=(label,c,n)=>{const b=document.createElement('button');b.innerHTML=label+'<span class="n">'+n+'</span>';
    b.setAttribute('aria-pressed',String(c===0?S.chap.size===0:S.chap.has(c)));
    b.onclick=()=>{if(c===0)S.chap.clear();else{S.chap.has(c)?S.chap.delete(c):S.chap.add(c)}save();reset();};box.appendChild(b)};
  mk('كل الفصول',0,base.length);CH.forEach(c=>mk(c.name,c.id,base.filter(q=>q.c===c.id).length))}
function reset(){examSet=null;examDone=false;for(const k in st)delete st[k];render();}
function pick(arr,n,seed){return shuffle(arr.slice(),seed).slice(0,n)}
function render(){segs();chips();const list=document.getElementById('list');list.innerHTML='';
  let items;
  if(S.mode==='exam'){
    if(!examSet){const seed=Date.now();examSet=[...pick(pool('mcq'),15,seed),...pick(pool('essay'),3,seed+1)]}
    items=examSet;
  } else items=pool(S.typ);
  stats(items);
  if(!items.length){list.innerHTML='<div class="empty">لا توجد أسئلة بهذا الاختيار. جرّب مصدراً أو فصلاً آخر.</div>';return}
  if(S.mode==='exam'){const m=items.filter(q=>q.t==='mcq').length,e=items.length-m;
    const h=document.createElement('div');h.className='bar';h.style.margin='4px 0 0';h.textContent='السؤال الأول: اختر الإجابة الصحيحة ('+m+')';list.appendChild(h)}
  items.forEach((q,n)=>{
    if(S.mode==='exam'&&q.t==='essay'&&(n===0||items[n-1].t!=='essay')){const h=document.createElement('div');h.className='bar';h.style.margin='10px 0 0';h.textContent='السؤال الثاني: أجب بإيجاز واختصار';list.appendChild(h)}
    list.appendChild(card(q,n+1))});
  if(S.mode==='exam'){const f=document.createElement('div');f.style.cssText='display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap';
    if(!examDone){const b=btn('صحّح الاختبار','dark');b.onclick=()=>{examDone=true;render();document.getElementById('stats').scrollIntoView({behavior:'smooth'})};f.appendChild(b)}
    const nb=btn('اختبار جديد');nb.onclick=reset;f.appendChild(nb);list.appendChild(f)}
}
function btn(t,c){const b=document.createElement('button');b.className='btn'+(c?' '+c:'');b.textContent=t;return b}
function stats(items){const el=document.getElementById('stats');const m=items.filter(q=>q.t==='mcq');
  const done=m.filter(q=>st[q.i]!==undefined),ok=done.filter(q=>st[q.i]===q.a);
  if(S.mode==='exam'){el.innerHTML= examDone?`<span>النتيجة: <b>${ok.length}</b> من <b>${m.length}</b> في الاختيارات</span><span>قارن إجاباتك المقالية بالنموذج تحت كل سؤال</span>`
      :`<span>اختبار محاكي: <b>${m.length}</b> اختياري و<b>${items.length-m.length}</b> مقالي، من الفصول المختارة</span><span>أجبت <b>${done.length}</b> من <b>${m.length}</b></span>`;return}
  el.innerHTML=S.typ==='mcq'?`<span>عدد الأسئلة: <b>${items.length}</b></span><span>أجبت: <b>${done.length}</b> · صحيحة: <b>${ok.length}</b></span>`:`<span>عدد الأسئلة المقالية: <b>${items.length}</b></span><span>اكتب إجابتك ثم اعرض الإجابة النموذجية</span>`;
  const r=btn('ابدأ من جديد');r.onclick=reset;el.appendChild(r)}
function card(q,n){const d=document.createElement('article');d.className='q';
  const ch=CH.find(c=>c.id===q.c).name;
  d.innerHTML=`<div class="qhead"><span class="num">${n}</span><div class="qt">${q.q}</div></div><div class="tags"><span class="tag ${q.s}">${q.s==='old'?'تجميعات':'جديد'}</span><span class="tag">${ch}</span></div>`;
  if(q.t==='mcq'){const box=document.createElement('div');box.className='opts';const ans=st[q.i];
    const reveal=S.mode==='train'?ans!==undefined:examDone;
    q.ord.forEach((k,pos)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="k">${L[pos]}</span><span>${q.o[k]}</span>`;
      if(reveal){b.disabled=true;if(k===q.a)b.classList.add('right');else if(k===ans)b.classList.add('wrong')}
      else if(ans===k)b.classList.add('pick');
      b.onclick=()=>{st[q.i]=k;render()};box.appendChild(b)});
    d.appendChild(box);
    if(reveal){const e=document.createElement('div');e.className='exp';const ok=ans===q.a;
      e.innerHTML=(ans===undefined?'<span class="v no">لم تُجب. </span>':ok?'<span class="v ok">إجابة صحيحة. </span>':'<span class="v no">إجابة خاطئة. </span>')+q.e;d.appendChild(e)}
  } else {
    const w=document.createElement('div');w.className='wrap-ta';const id='ta'+q.i;w.innerHTML=`<label for="${id}" class="sub">اكتب إجابتك هنا (اختياري):</label><textarea id="${id}"></textarea>`;const ta=w.querySelector('textarea');ta.value=st['t'+q.i]||'';ta.oninput=()=>{st['t'+q.i]=ta.value};d.appendChild(w);
    const t=document.createElement('div');t.className='essay-tools';const a=document.createElement('div');a.className='ans';a.innerHTML=q.ans;
    a.hidden=!(S.mode==='exam'&&examDone)&&!st['e'+q.i];
    if(S.mode==='train'){const b=btn(a.hidden?'اعرض الإجابة النموذجية':'أخفِ الإجابة');b.onclick=()=>{st['e'+q.i]=!st['e'+q.i];a.hidden=!st['e'+q.i];b.textContent=a.hidden?'اعرض الإجابة النموذجية':'أخفِ الإجابة'};t.appendChild(b);d.appendChild(t)}
    d.appendChild(a)}
  return d}
for(const id of ['mode','src','typ'])document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{S[id]=b.dataset.v;save();reset()});
render();
</script>
